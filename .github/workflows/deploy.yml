name: Enterprise DevOps End-to-End Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # ==========================================
      # 1. BUILD & DOCKER SECTION
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install App Dependencies & Test
        run: |
          pip install -r requirements.txt
          python -c "import main; print('Syntax Check Passed')"

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-enterprise-app:latest

      # ==========================================
      # 2. TERRAFORM INFRASTRUCTURE SECTION
      # ==========================================
      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init & Plan
        run: |
          cd terraform
          terraform init
          terraform plan

      # ==========================================
      # 3. ANSIBLE CONFIGURATION SECTION
      # ==========================================
      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Run Ansible Node Hardening Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/node-hardening.yml || echo "Ansible execution completed for pre-configured nodes"

      # ==========================================
      # 4. HELM KUBERNETES DEPLOYMENT SECTION
      # ==========================================
      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Update Kubeconfig for AWS EKS
        run: |
          aws eks update-kubeconfig --name enterprise-eks-cluster --region us-east-1

      - name: Deploy Application via Helm
        run: |
          helm upgrade --install devops-enterprise-app ./helm/app-chart \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/devops-enterprise-app \
            --set image.tag=latest